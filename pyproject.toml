[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragspark"
version = "0.3.0"
description = "Unified One-Command Industry RAG Pipeline Library with Hybrid Search, Query Rewriting, Multi-VectorDB, and Studio UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "rag",
    "llm",
    "vector-database",
    "chromadb",
    "pdf-parser",
    "chunking",
    "hybrid-search",
    "prompt-engineering",
    "query-rewriting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.30.0",
    "google-genai>=0.3.0",
    "ipywidgets>=8.1.0",
]
dev = [
    "pytest>=8.0.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[project.scripts]
ragspark = "ragspark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ragspark"]

